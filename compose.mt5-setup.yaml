# One-time setup only. The desktop port binds to VPS loopback, never the internet.
services:
  mt5-setup:
    build:
      context: .
      dockerfile: connectors/mt5/Dockerfile
    command: ["python3", "/app/setup.py"]
    stdin_open: true
    tty: true
    ports: ["127.0.0.1:5901:5900", "127.0.0.1:6080:6080"]
    volumes:
      - ${MT5_TERMINAL_SEED:-./.local-data/mt5-seed}:/seed
    mem_limit: 1536m
    cpus: 1.0
    pids_limit: 256
    init: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

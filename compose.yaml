services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: replay
      POSTGRES_USER: replay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replay}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U replay -d replay"]
      interval: 3s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      AUTH_REGISTRATION_ENABLED: ${AUTH_REGISTRATION_ENABLED:-false}
      AUTH_OWNER_EMAIL: ${AUTH_OWNER_EMAIL:-}
      AUTH_OWNER_USERNAME: ${AUTH_OWNER_USERNAME:-owner}
      AUTH_BOOTSTRAP_PASSWORD: ${AUTH_BOOTSTRAP_PASSWORD:-}
      AUTH_ALLOWED_EMAILS: ${AUTH_ALLOWED_EMAILS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      ORDERFLOW_FEED: ${ORDERFLOW_FEED:-disabled}
      ORDERFLOW_NQ_CONTRACT: ${ORDERFLOW_NQ_CONTRACT:-}
      ORDERFLOW_ES_CONTRACT: ${ORDERFLOW_ES_CONTRACT:-}
      ORDERFLOW_CUSTOMER_ACCESS: ${ORDERFLOW_CUSTOMER_ACCESS:-false}
      ORDERFLOW_DATA_RIGHTS_CONFIRMED: ${ORDERFLOW_DATA_RIGHTS_CONFIRMED:-false}
      DATABENTO_API_KEY: ${DATABENTO_API_KEY:-}
      DATABASE_URL: postgresql://replay:${POSTGRES_PASSWORD:-replay}@db:5432/replay
      API_HOST: 0.0.0.0
      API_PORT: 3001
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://127.0.0.1:${PORT:-3000}}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://127.0.0.1:${PORT:-3000}}
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres-data:
